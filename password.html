<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Access</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
    p { margin: 0 0 1.25rem; color: #8b949e; font-size: 0.92rem; }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    input {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 0.95rem;
    }
    input:focus {
      outline: 2px solid #2f81f7;
      border-color: transparent;
    }
    button {
      padding: 0.65rem 0.9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    .btn-paste {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
    }
    .btn-submit {
      width: 100%;
      background: #238636;
      color: #ffffff;
      padding: 0.75rem;
    }
    .msg {
      margin-top: 0.75rem;
      min-height: 1.2rem;
      font-size: 0.85rem;
      color: #f85149;
    }
    #protected-content {
      display: none;
      max-width: 640px;
      padding: 2rem;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>

  <div class="card" id="login-box">
    <h1>Private Access</h1>
    <p>Paste or enter the password to continue.</p>

    <form id="auth-form">
      <div class="input-group">
        <input
          type="password"
          id="pass-input"
          placeholder="Password"
          autocomplete="off"
          required
        />
        <button type="button" class="btn-paste" id="paste-btn">Paste</button>
      </div>
      <button type="submit" class="btn-submit">Unlock</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div id="protected-content">
    <h2>Unlocked Content</h2>
    <p>Place your main GitHub Pages content here.</p>
  </div>

  <script>
    // Note: On static hosts like GitHub Pages, client-side checks are only
    // a basic gate, not true cryptographic security.
    const PASS_CODE = atob("ZHNob21lYWxvbmUxMg=="); // "dshomealone12"
    const MAX_ATTEMPTS = 5;
    const LOCK_SECONDS = 30;

    let attempts = 0;
    let lockedUntil = 0;

    const form = document.getElementById("auth-form");
    const input = document.getElementById("pass-input");
    const pasteBtn = document.getElementById("paste-btn");
    const msg = document.getElementById("msg");
    const loginBox = document.getElementById("login-box");
    const content = document.getElementById("protected-content");

    pasteBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text.trim();
        input.focus();
        msg.textContent = "";
      } catch {
        msg.textContent = "Allow clipboard access or use Ctrl+V / Cmd+V.";
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const now = Math.floor(Date.now() / 1000);

      if (now < lockedUntil) {
        msg.textContent = `Too many attempts. Wait ${lockedUntil - now}s.`;
        return;
      }

      if (input.value === PASS_CODE) {
        loginBox.style.display = "none";
        content.style.display = "block";
      } else {
        attempts++;
        if (attempts >= MAX_ATTEMPTS) {
          lockedUntil = now + LOCK_SECONDS;
          attempts = 0;
          msg.textContent = `Temporarily locked for ${LOCK_SECONDS} seconds.`;
        } else {
          msg.textContent = `Incorrect password (${attempts}/${MAX_ATTEMPTS}).`;
        }
        input.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
