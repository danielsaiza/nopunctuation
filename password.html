<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password - daniel saiza</title>

<style>
/* FONTS */

@font-face {
    font-family: "CityBurn";
    src: url("./cityburn.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: "Bohemian Typewriter";
    src: url("./bohemian-typewriter.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

/* GENERAL RESET (FIXED UNIVERSAL SELECTOR) */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fad614;
    width: 100%;
    min-height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: "CityBurn", sans-serif;
    transition: background-color 0.75s cubic-bezier(0.22, 1, 0.36, 1);
}

/* LOADING SCREEN */

#loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.7s ease, visibility 0.7s ease;
    z-index: 10;
}

#loader.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 2.5px solid rgba(250, 214, 20, 0.16);
    border-top-color: #fad614;
    border-right-color: #fad614;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* PASSWORD SCREEN */

#password-screen {
    position: fixed;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 0.75s ease, transform 0.75s ease, visibility 0.75s ease;
    z-index: 5;
}

#password-screen.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.title {
    font-family: "CityBurn", sans-serif;
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 3px;
    color: #fad614;
    text-transform: uppercase;
    text-align: center;
}

/* INPUT WRAPPER & SHOW/HIDE TOGGLE */

.input-wrapper {
    position: relative;
    width: 250px;
    max-width: 100%;
    display: flex;
    align-items: center;
}

.password-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #fad614;
    border-radius: 0;
    outline: none;
    color: #fad614;
    font-family: "CityBurn", sans-serif;
    font-size: 20px;
    text-align: center;
    padding: 12px 46px;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: border-color 0.25s ease;
}

.password-input::placeholder {
    color: #fad614;
    opacity: 0.4;
}

.password-input:focus {
    border-bottom-width: 1.5px;
}

.toggle-visibility {
    position: absolute;
    right: 2px;
    background: none;
    border: none;
    padding: 6px 4px;
    color: #fad614;
    opacity: 0.65;
    font-family: "Bohemian Typewriter", serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s ease;
}

.toggle-visibility:hover,
.toggle-visibility:focus-visible {
    opacity: 1;
    outline: none;
}

/* SHAKE ANIMATION ON INCORRECT PASSWORD */

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
}

.shake {
    animation: shake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

/* ENTER BUTTON */

.enter-button {
    background: #fad614;
    color: #000;
    border: 1px solid #fad614;
    padding: 11px 38px;
    border-radius: 50px;
    font-family: "CityBurn", sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.12s ease;
}

.enter-button:hover {
    background: #fff7ea;
    border-color: #fff7ea;
    color: #000;
}

.enter-button:active {
    background: #fff7ea;
    border-color: #fff7ea;
    color: #000;
    transform: scale(0.97);
}

/* RESERVED SPACE FOR ERROR MESSAGE (NO LAYOUT SHIFT) */

#error {
    min-height: 16px;
    font-family: "Bohemian Typewriter", serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #fad614;
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
}

#error.visible {
    opacity: 1;
    visibility: visible;
}

/* SEAMLESS CREAM TRANSITION MATCHING home.html (#fff7ea) */

body.entering {
    background: #fff7ea;
}

body.entering #password-screen {
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
}

/* MOBILE */

@media (max-width: 600px) {
    .title {
        font-size: 34px;
        letter-spacing: 2.5px;
    }

    .input-wrapper {
        width: 230px;
    }

    .password-input {
        font-size: 18px;
        padding: 10px 42px;
    }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->

<div id="loader" role="button" tabindex="0" aria-label="Loading screen, click or press any key to continue">
    <div class="spinner"></div>
</div>

<!-- PASSWORD SCREEN -->

<div id="password-screen">
    <div class="title">PASSWORD</div>

    <div class="input-wrapper" id="inputWrapper">
        <input
            type="password"
            id="password"
            class="password-input"
            placeholder="••••"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            aria-label="Password"
        >
        <button
            type="button"
            id="toggleVisibility"
            class="toggle-visibility"
            aria-label="Show password"
        >SHOW</button>
    </div>

    <button type="button" class="enter-button" id="enterBtn">ENTER</button>

    <div id="error" role="alert" aria-live="polite">INCORRECT PASSWORD</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const loader = document.getElementById("loader");
    const passwordScreen = document.getElementById("password-screen");
    const inputWrapper = document.getElementById("inputWrapper");
    const passwordInput = document.getElementById("password");
    const toggleVisibilityBtn = document.getElementById("toggleVisibility");
    const enterBtn = document.getElementById("enterBtn");
    const errorEl = document.getElementById("error");

    let loaderFinished = false;
    let isRedirecting = false;

    // 4-second loading sequence & skip support
    function revealPasswordScreen() {
        if (loaderFinished) return;
        loaderFinished = true;

        loader.classList.add("fade-out");

        setTimeout(() => {
            loader.style.display = "none";
            passwordScreen.classList.add("show");
            passwordInput.focus();
        }, 650);
    }

    const loaderTimer = setTimeout(revealPasswordScreen, 4000);

    // Allow skipping loader with click/tap or any key
    loader.addEventListener("click", () => {
        clearTimeout(loaderTimer);
        revealPasswordScreen();
    });

    document.addEventListener("keydown", (e) => {
        if (!loaderFinished && (e.key === "Enter" || e.key === " " || e.key === "Escape")) {
            clearTimeout(loaderTimer);
            revealPasswordScreen();
        }
    });

    // Toggle password visibility (SHOW / HIDE)
    toggleVisibilityBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleVisibilityBtn.textContent = isPassword ? "HIDE" : "SHOW";
        toggleVisibilityBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
        passwordInput.focus();
    });

    // Hide error automatically as soon as the user types again
    passwordInput.addEventListener("input", () => {
        if (errorEl.classList.contains("visible")) {
            errorEl.classList.remove("visible");
        }
    });

    // Case-insensitive password validation & seamless cream transition to home.html
    function checkPassword() {
        if (isRedirecting) return;

        const value = passwordInput.value.trim().toLowerCase();

        if (value === "treehouse") {
            isRedirecting = true;
            errorEl.classList.remove("visible");
            passwordInput.blur();
            document.body.classList.add("entering");

            setTimeout(() => {
                window.location.href = "home.html";
            }, 750);
        } else {
            errorEl.classList.add("visible");

            // Retrigger subtle shake animation
            inputWrapper.classList.remove("shake");
            void inputWrapper.offsetWidth;
            inputWrapper.classList.add("shake");
            passwordInput.focus();
        }
    }

    enterBtn.addEventListener("click", checkPassword);

    passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            checkPassword();
        }
    });
});
</script>

</body>
</html>
