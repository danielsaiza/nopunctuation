<!DOCTYPE html>
<html lang="en">
<head> <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home - daniel saiza</title>
  <link rel="icon" type="image/svg+xml" href="danielsaiza.svg" />
  <style>
    @font-face {
      font-family: 'Duality';
      src: url('duality.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Top Left: Logo danielsaiza.svg */
    .top-left-logo {
      position: fixed;
      top: 2rem;
      left: 2.5rem;
      width: 150px;
      height: auto;
      z-index: 20;
    }

    /* Top Right Navigation */
    header {
      position: fixed;
      top: 2rem;
      right: 2.5rem;
      z-index: 20;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
    }

    .nav-btn {
      text-decoration: none;
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 1.35rem;
      text-transform: lowercase;
      color: #111111;
      transition: color 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e;
      transform: translateY(-2px);
    }

    /* Contenedor Central Perfectamente Centrado */
    main.center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 0 2rem;
      z-index: 10;
    }

    /* Logo mistletoeds.png Mucho Más Grande */
    .hero-logo {
      width: 100%;
      max-width: 620px; /* Tamaño aumentado */
      height: auto;
      margin-bottom: 4rem;
      display: block;
    }

    /* Grid de las 3 imágenes mucho más grandes */
    .items-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6rem; /* Mayor espacio entre elementos */
    }

    .item-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .item-card:hover {
      transform: scale(1.08);
    }

    .item-img {
      width: 170px; /* Tamaño mucho más grande */
      height: 170px;
      object-fit: contain;
      display: block;
    }

    /* Footer Bottom Left */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 2.5rem;
      font-size: 0.85rem;
      z-index: 20;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .static-text {
      color: #111111;
      font-weight: 700;
      text-transform: lowercase;
    }

    .legal-link {
      color: #111111;
      text-decoration: none;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    .legal-link:hover,
    .legal-link:active {
      color: #e12d3e;
    }

    /* Tracklist Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid #111111;
      border-radius: 12px;
      padding: 2.5rem 3.5rem;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      position: relative;
    }

    .modal-title {
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 2.5rem;
      text-transform: lowercase;
      margin-bottom: 1.5rem;
      color: #111111;
    }

    .tracklist {
      list-style: none;
      text-align: left;
      font-size: 1rem;
      line-height: 2.2;
      color: #222222;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #111111;
    }

    .close-btn:hover {
      color: #e12d3e;
    }

    /* Ajuste para pantallas pequeñas */
    @media (max-width: 768px) {
      body {
        overflow: auto;
      }
      .top-left-logo {
        top: 1.2rem;
        left: 1.5rem;
        width: 120px;
      }
      header {
        top: 1.2rem;
        right: 1.5rem;
      }
      .nav-menu {
        gap: 1rem;
      }
      .nav-btn {
        font-size: 1.1rem;
      }
      .hero-logo {
        max-width: 320px;
        margin-bottom: 2.5rem;
      }
      .items-grid {
        gap: 2rem;
      }
      .item-img {
        width: 100px;
        height: 100px;
      }
      footer {
        position: relative;
        left: auto;
        bottom: auto;
        padding: 2rem 1.5rem 1.5rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Esquina superior izquierda -->
  <img src="danielsaiza.svg" alt="Daniel Saiza Logo" class="top-left-logo" />

  <!-- Esquina superior derecha -->
  <header>
    <nav class="nav-menu">
      <a href="#store" class="nav-btn">store</a>
      <a href="#videos" class="nav-btn">videos</a>
      <a href="#music" class="nav-btn">music</a>
      <a href="#tour" class="nav-btn">tour</a>
    </nav>
  </header>

  <!-- CENTRO EXACTO DE LA PANTALLA -->
  <main class="center-stage">
    <!-- Logo Mistletoe Daniel Saiza -->
    <img src="mistletoeds.png" alt="Mistletoe Daniel Saiza" class="hero-logo" />

    <!-- 3 Botones de imágenes en fila -->
    <div class="items-grid">
      <a href="#letter" class="item-card">
        <img src="danielsletter.png" alt="Daniel's Letter" class="item-img" />
      </a>

      <a href="#wishlist" class="item-card">
        <img src="wishlist.png" alt="Wishlist" class="item-img" />
      </a>

      <button type="button" class="item-card" id="mistletoe-btn">
        <img src="mistletoe.png" alt="Mistletoe" class="item-img" />
      </button>
    </div>
  </main>

  <!-- Esquina inferior izquierda -->
  <footer>
    <div class="footer-content">
      <span class="static-text">© daniel saiza</span>
      <a href="#privacy" class="legal-link">privacy policy</a>
      <a href="#terms" class="legal-link">terms &amp; conditions</a>
      <a href="#donotsell" class="legal-link">do not sell my personal information</a>
      <a href="#cookies" class="legal-link">cookie choices</a>
    </div>
  </footer>

  <!-- Ventana desplegable de Tracklist -->
  <div class="modal-overlay" id="tracklist-modal">
    <div class="modal-box">
      <button type="button" class="close-btn" id="close-modal">&times;</button>
      <h2 class="modal-title">tracklist</h2>
      <ol class="tracklist">
        <li>1. snowballs</li>
        <li>2. pumpkin pie</li>
        <li>3. cindy lou who</li>
        <li>4. santa knows how to make me happy</li>
        <li>5. christmas tree farm</li>
        <li>6. under the lights</li>
      </ol>
    </div>
  </div>

  <script>
    const mistletoeBtn = document.getElementById("mistletoe-btn");
    const modal = document.getElementById("tracklist-modal");
    const closeBtn = document.getElementById("close-modal");

    mistletoeBtn.addEventListener("click", () => {
      modal.classList.add("active");
    });

    closeBtn.addEventListener("click", () => {
      modal.classList.remove("active");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("active");
      }
    });
  </script>

</body>
</html>
