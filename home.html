<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home - daniel saiza</title>
  <link rel="icon" type="image/svg+xml" href="danielsaiza.svg" />
  <style>
    /* Carga de la fuente custom duality.otf */
    @font-face {
      font-family: 'Duality';
      src: url('duality.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Header & Right Navigation */
    header {
      width: 100%;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-btn {
      text-decoration: none;
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 1.25rem;
      text-transform: lowercase; /* Forzar minúsculas */
      color: #111111;
      transition: color 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e;
      transform: translateY(-2px);
    }

    /* Bottom Right Logo (Más grande) */
    .brand-logo {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      max-width: 220px; /* Tamaño más grande */
      height: auto;
      z-index: 10;
    }

    /* Footer Bottom Left / Center */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 2.5rem;
      z-index: 10;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .static-text {
      color: #111111;
      font-weight: bold;
    }

    .legal-link {
      font-family: 'Duality', system-ui, sans-serif;
      color: #111111;
      text-decoration: none;
      text-transform: lowercase; /* Forzar minúsculas */
      transition: color 0.2s ease;
    }

    .legal-link:hover,
    .legal-link:active {
      color: #e12d3e;
    }

    /* Adaptación para pantallas pequeñas */
    @media (max-width: 768px) {
      header {
        padding: 1.2rem 1.5rem;
        justify-content: center;
      }
      .nav-menu {
        gap: 1.2rem;
      }
      .nav-btn {
        font-size: 1.1rem;
      }
      .brand-logo {
        bottom: 5rem;
        right: 1.5rem;
        max-width: 140px;
      }
      footer {
        left: 1.5rem;
        bottom: 1.2rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Right Navigation -->
  <header>
    <nav class="nav-menu">
      <a href="#store" class="nav-btn">store</a>
      <a href="#videos" class="nav-btn">videos</a>
      <a href="#music" class="nav-btn">music</a>
      <a href="#tour" class="nav-btn">tour</a>
    </nav>
  </header>

  <!-- Bottom Right Logo -->
  <img src="danielsaiza.svg" alt="Daniel Saiza Logo" class="brand-logo" />

  <!-- Bottom Left Footer -->
  <footer>
    <div class="footer-content">
      <span class="static-text">© daniel saiza</span>
      <a href="#privacy" class="legal-link">privacy policy</a>
      <a href="#terms" class="legal-link">terms & conditions</a>
      <a href="#donotsell" class="legal-link">do not sell my personal information</a>
      <a href="#cookies" class="legal-link">cookie choices</a>
    </div>
  </footer>

</body>
</html>
