<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home - daniel saiza</title>
  <link rel="icon" type="image/svg+xml" href="danielsaiza.svg" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Main Container with Nav Left */
    .main-content {
      padding: 3rem 2rem;
      display: flex;
      align-items: center;
      min-height: 80vh;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .nav-btn {
      display: inline-block;
      text-decoration: none;
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #111111;
      transition: color 0.2s ease, transform 0.15s ease;
      width: fit-content;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e;
      transform: translateX(4px);
    }

    /* Logo Bottom Right */
    .brand-logo {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      max-width: 130px;
      height: auto;
      z-index: 10;
    }

    /* Footer Bottom Center */
    footer {
      width: 100%;
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: #111111;
      line-height: 1.6;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.4rem 0.6rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .static-text {
      color: #111111;
      font-weight: 600;
    }

    .legal-link {
      color: #111111;
      text-decoration: none;
      text-transform: capitalize;
      transition: color 0.2s ease;
    }

    .legal-link:hover,
    .legal-link:active {
      color: #e12d3e;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .main-content {
        padding: 2rem 1.5rem;
      }
      .nav-btn {
        font-size: 1.6rem;
      }
      .brand-logo {
        bottom: 4.5rem;
        right: 1.5rem;
        max-width: 90px;
      }
      footer {
        padding-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Left Navigation -->
  <main class="main-content">
    <nav class="nav-menu">
      <a href="#store" class="nav-btn">Store</a>
      <a href="#videos" class="nav-btn">Videos</a>
      <a href="#music" class="nav-btn">Music</a>
      <a href="#tour" class="nav-btn">Tour</a>
    </nav>
  </main>

  <!-- Bottom Right Logo -->
  <img src="danielsaiza.svg" alt="Daniel Saiza Logo" class="brand-logo" />

  <!-- Bottom Center Footer -->
  <footer>
    <div class="footer-content">
      <span class="static-text">© daniel saiza</span>
      <a href="#privacy" class="legal-link">privacy policy</a>
      <a href="#terms" class="legal-link">terms & conditions</a>
      <a href="#donotsell" class="legal-link">do not sell my personal information</a>
      <a href="#cookies" class="legal-link">cookie choices</a>
    </div>
  </footer>

</body>
</html>
