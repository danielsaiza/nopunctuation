<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home - daniel saiza</title>
  <link rel="icon" type="image/svg+xml" href="danielsaiza.svg" />
  <style>
    @font-face {
      font-family: 'Duality';
      src: url('duality.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* Top Navigation Container */
    .top-bar {
      width: 100%;
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
    }

    /* Top Left Promo (Logo + Pre-Save Button) */
    .corner-promo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .corner-logo {
      width: 180px;
      height: auto;
      min-height: 40px;
      display: block;
    }

    .presave-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #111111;
      color: #ffffff !important;
      padding: 0.65rem 1.25rem;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .presave-btn:hover {
      background-color: #222222;
    }

    .presave-btn:active {
      background-color: #e12d3e !important;
      color: #ffffff !important;
      transform: scale(0.97);
    }

    /* Top Right Links (Store, Videos, Music, Tour) */
    .nav-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-btn {
      text-decoration: none;
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 1.35rem;
      text-transform: lowercase;
      color: #111111;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e !important;
      transform: translateY(-2px);
    }

    /* Main Center Area (Espacio listo para contenido/fotos) */
    .hero-area {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6rem 2rem 4rem;
    }

    /* Bottom Section */
    .bottom-bar {
      width: 100%;
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 20;
    }

    /* Footer Left (Legal Links) */
    footer {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .static-text {
      color: #111111;
      font-weight: 700;
      text-transform: lowercase;
    }

    .legal-link {
      font-family: system-ui, -apple-system, sans-serif;
      color: #111111;
      text-decoration: none;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    .legal-link:hover,
    .legal-link:active {
      color: #e12d3e !important;
    }

    /* Bottom Right Logo (mistletoeds.png) */
    .brand-logo-bottom {
      width: 180px;
      height: auto;
      min-height: 40px;
      display: block;
    }

    /* Responsive mobile view */
    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        gap: 1.5rem;
        padding: 1.5rem;
      }
      .bottom-bar {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 1.5rem;
        padding: 1.5rem;
        position: relative;
      }
      .corner-logo {
        width: 140px;
      }
      .brand-logo-bottom {
        width: 130px;
      }
      .nav-menu {
        gap: 1.2rem;
      }
      .nav-btn {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Area -->
  <div class="top-bar">
    <!-- Top Left: danielsaiza.svg + pre-save -->
    <div class="corner-promo">
      <img src="danielsaiza.svg" alt="Daniel Saiza" class="corner-logo" />
      <a href="#presave" class="presave-btn">pre-save</a>
    </div>

    <!-- Top Right: Menu Buttons -->
    <nav class="nav-menu">
      <a href="#store" class="nav-btn">store</a>
      <a href="#videos" class="nav-btn">videos</a>
      <a href="#music" class="nav-btn">music</a>
      <a href="#tour" class="nav-btn">tour</a>
    </nav>
  </div>

  <!-- Center Content Placeholder -->
  <main class="hero-area">
    <!-- Aquí irán las imágenes o contenido central -->
  </main>

  <!-- Bottom Footer & Logo Area -->
  <div class="bottom-bar">
    <!-- Bottom Left Footer -->
    <footer>
      <div class="footer-content">
        <span class="static-text">© daniel saiza</span>
        <a href="#privacy" class="legal-link">privacy policy</a>
        <a href="#terms" class="legal-link">terms &amp; conditions</a>
        <a href="#donotsell" class="legal-link">do not sell my personal information</a>
        <a href="#cookies" class="legal-link">cookie choices</a>
      </div>
    </footer>

    <!-- Bottom Right: mistletoeds.png -->
    <img src="mistletoeds.png" alt="Mistletoe DS" class="brand-logo-bottom" />
  </div>

</body>
</html>
