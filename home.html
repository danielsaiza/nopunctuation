    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

    /* Top Left: Logo danielsaiza.svg + Pre-Save Button */
    .corner-promo {
      position: fixed;
      top: 1.5rem;
      left: 2.5rem;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .corner-logo {
      max-width: 180px; /* Tamaño para danielsaiza.svg */
      height: auto;
      display: block;
    }

    .presave-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #111111;
      color: #ffffff;
      padding: 0.55rem 1.15rem;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
      cursor: pointer;
    }

    .presave-btn:active {
      background-color: #e12d3e;
      color: #ffffff;
      transform: scale(0.98);
    }

    /* Top Right Navigation */
    header {
      width: 100%;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 15;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-btn {
      text-decoration: none;
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 1.25rem;
      text-transform: lowercase;
      color: #111111;
      transition: color 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e;
      transform: translateY(-2px);
    }

    .brand-logo-bottom {

      height: auto;
      z-index: 10;
    }

      line-height: 1.4;
    }

      text-transform: lowercase;
