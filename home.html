<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home - daniel saiza</title>
  <link rel="icon" type="image/svg+xml" href="danielsaiza.svg" />
  <style>
    @font-face {
      font-family: 'Duality';
      src: url('duality.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Top Left Logo + Pre-Save Button */
    .corner-promo {
      position: fixed;
      top: 1.5rem;
      left: 2.5rem;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .corner-logo {
      max-width: 145px;
      height: auto;
      display: block;
    }

    .presave-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #111111;
      color: #ffffff;
      padding: 0.55rem 1.15rem;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
      cursor: pointer;
    }

    .presave-btn:active {
      background-color: #e12d3e;
      color: #ffffff;
      transform: scale(0.98);
    }

    /* Top Right Navigation */
    header {
      width: 100%;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 15;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-btn {
      text-decoration: none;
      font-family: 'Duality', system-ui, sans-serif;
      font-size: 1.25rem;
      text-transform: lowercase;
      color: #111111;
      transition: color 0.2s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn:active {
      color: #e12d3e;
      transform: translateY(-2px);
    }

    /* Bottom Right Logo */
    .brand-logo {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      max-width: 220px;
      height: auto;
      z-index: 10;
    }

    /* Footer Bottom Left (Normal Font) */
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 2.5rem;
      z-index: 10;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .static-text {
      color: #111111;
      font-weight: 600;
      text-transform: lowercase;
    }

    .legal-link {
      font-family: system-ui, -apple-system, sans-serif;
      color: #111111;
      text-decoration: none;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    .legal-link:hover,
    .legal-link:active {
      color: #e12d3e;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .corner-promo {
        top: 1.2rem;
        left: 1.5rem;
      }
      .corner-logo {
        max-width: 110px;
      }
      header {
        padding: 1.2rem 1.5rem;
        justify-content: flex-end;
      }
      .nav-menu {
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 210px;
      }
      .nav-btn {
        font-size: 1.05rem;
      }
      .brand-logo {
        bottom: 5rem;
        right: 1.5rem;
        max-width: 140px;
      }
      footer {
        left: 1.5rem;
        right: 1.5rem;
        bottom: 1.2rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Left Logo + Pre-Save Button -->
  <div class="corner-promo">
    <img src="mistletoeds.png" alt="Mistletoe DS" class="corner-logo" />
    <a href="#presave" class="presave-btn">pre-save</a>
  </div>

  <!-- Top Right Navigation -->
  <header>
    <nav class="nav-menu">
      <a href="#store" class="nav-btn">store</a>
      <a href="#videos" class="nav-btn">videos</a>
      <a href="#music" class="nav-btn">music</a>
      <a href="#tour" class="nav-btn">tour</a>
    </nav>
  </header>

  <!-- Bottom Right Logo -->
  <img src="danielsaiza.svg" alt="Daniel Saiza Logo" class="brand-logo" />

  <!-- Bottom Left Footer -->
  <footer>
    <div class="footer-content">
      <span class="static-text">© daniel saiza</span>
      <a href="#privacy" class="legal-link">privacy policy</a>
      <a href="#terms" class="legal-link">terms &amp; conditions</a>
      <a href="#donotsell" class="legal-link">do not sell my personal information</a>
      <a href="#cookies" class="legal-link">cookie choices</a>
    </div>
  </footer>

</body>
</html>
