<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>password - daniel saiza</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: #f4f1ea;
      background:
        radial-gradient(circle at 50% 18%, rgba(190, 24, 38, 0.24), transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(127, 17, 26, 0.18), transparent 45%),
        linear-gradient(180deg, #09080a 0%, #120c10 55%, #070708 100%);
      overflow-x: hidden;
    }

    .stage-card {
      width: 100%;
      max-width: 400px;
      padding: 2.3rem 2rem;
      border-radius: 18px;
      background: rgba(15, 12, 15, 0.88);
      border: 1px solid rgba(225, 45, 62, 0.28);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.78),
        0 0 36px rgba(185, 20, 35, 0.14);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .era-tag {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #ff4d5a;
      margin-bottom: 0.9rem;
    }

    .logo {
      display: block;
      max-width: 128px;
      height: auto;
      margin: 0 auto 1.1rem;
      filter: drop-shadow(0 0 14px rgba(225, 45, 62, 0.35));
    }

    h1 {
      margin: 0 0 0.4rem;
      font-family: "Cinzel", Georgia, serif;
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff8f5;
    }

    .subtitle {
      margin: 0 0 1.6rem;
      font-size: 0.9rem;
      color: #b7aeb4;
      line-height: 1.45;
    }

    .input-row {
      display: flex;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }

    input {
      flex: 1;
      padding: 0.78rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(8, 7, 9, 0.92);
      color: #fff8f5;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #7c747a;
      letter-spacing: 0.03em;
    }

    input:focus {
      outline: none;
      border-color: #e12d3e;
      box-shadow: 0 0 0 3px rgba(225, 45, 62, 0.2);
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.14s ease, opacity 0.18s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-paste {
      padding: 0.78rem 1rem;
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.06);
      color: #f4f1ea;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .btn-paste:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-enter {
      width: 100%;
      padding: 0.88rem 1rem;
      font-size: 0.86rem;
      background: linear-gradient(135deg, #c81e2b 0%, #8f111c 100%);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(200, 30, 43, 0.35);
    }

    .btn-enter:hover {
      opacity: 0.94;
    }

    .status-msg {
      margin-top: 0.9rem;
      min-height: 1.25rem;
      font-size: 0.84rem;
      color: #ff6b76;
    }

    .status-msg.success {
      color: #f4f1ea;
    }
  </style>
</head>
<body>
  <main class="stage-card">
    <span class="era-tag">Official Archive • VIP</span>
    <img src="logo.png" alt="Artist Logo" class="logo" />
    <h1>Enter The Era</h1>
    <p class="subtitle">Paste or enter your backstage key to unlock <code>home.html</code>.</p>

    <form id="pass-form">
      <div class="input-row">
        <input
          type="password"
          id="password-input"
          placeholder="Enter password"
          autocomplete="off"
          required
        />
        <button type="button" class="btn-paste" id="paste-btn">Paste</button>
      </div>
      <button type="submit" class="btn-enter">Enter</button>
      <div class="status-msg" id="status-msg"></div>
    </form>
  </main>

  <script>
    const SECRET_KEY = atob("ZHNob21lYWxvbmUxMg=="); // "dshomealone12"
    const TARGET_PAGE = "home.html";
    const MAX_ATTEMPTS = 5;
    const COOLDOWN_SECONDS = 30;

    let failedAttempts = 0;
    let lockUntil = 0;

    const form = document.getElementById("pass-form");
    const input = document.getElementById("password-input");
    const pasteBtn = document.getElementById("paste-btn");
    const statusMsg = document.getElementById("status-msg");

    pasteBtn.addEventListener("click", async () => {
      statusMsg.classList.remove("success");
      try {
        const clipText = await navigator.clipboard.readText();
        input.value = clipText.trim();
        input.focus();
        statusMsg.textContent = "";
      } catch {
        statusMsg.textContent = "Allow clipboard access or press Ctrl+V / Cmd+V.";
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const now = Math.floor(Date.now() / 1000);

      if (now < lockUntil) {
        statusMsg.classList.remove("success");
        statusMsg.textContent = `Too many tries. Wait ${lockUntil - now}s.`;
        return;
      }

      if (input.value === SECRET_KEY) {
        sessionStorage.setItem("stage_unlocked", "true");
        statusMsg.classList.add("success");
        statusMsg.textContent = "Access granted. Redirecting...";
        window.location.replace(TARGET_PAGE);
      } else {
        failedAttempts += 1;
        statusMsg.classList.remove("success");
        if (failedAttempts >= MAX_ATTEMPTS) {
          lockUntil = now + COOLDOWN_SECONDS;
          failedAttempts = 0;
          statusMsg.textContent = `Locked for ${COOLDOWN_SECONDS} seconds.`;
        } else {
          statusMsg.textContent = `Wrong password (${failedAttempts}/${MAX_ATTEMPTS}).`;
        }
        input.value = "";
        input.focus();
      }
    });
  </script>
</body>
</html>
