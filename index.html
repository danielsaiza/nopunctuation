<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - daniel saiza</title>

<style>
/* FONTS */
@font-face {
    font-family: "CityBurn";
    src: url("./cityburn.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: "Bohemian Typewriter";
    src: url("./bohemian-typewriter.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}

/* GENERAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff7ea;
    color: #000;
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Bohemian Typewriter", serif;
}

/* LOADING SCREEN */
#loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease, visibility 0.5s ease;
    cursor: pointer;
}

#loader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#loader.is-gone {
    display: none !important;
}

.spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(250, 214, 20, 0.18);
    border-top-color: #fad614;
    border-right-color: #fad614;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* TOP HEADER NAVIGATION */
.top-header {
    position: fixed;
    top: 22px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 20;
}

.top-nav {
    display: flex;
    align-items: center;
    gap: 22px;
}

.top-nav button,
.top-nav a {
    background: none;
    border: none;
    padding: 0;
    color: #000;
    font-family: "Bohemian Typewriter", serif;
    font-size: 15px;
    font-weight: normal;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.3s ease;
}

.top-nav button:hover,
.top-nav a:hover,
.top-nav button.active-link {
    color: #99927f;
}

/* SPLIT PILL BUTTON: RWP / SC */
.pill-toggle {
    display: inline-flex;
    align-items: center;
    background: #000;
    border: 2px solid #000;
    border-radius: 999px;
    padding: 2px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.pill-segment {
    font-family: "Bohemian Typewriter", serif;
    font-size: 13px;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 16px;
    border-radius: 999px;
    transition: background-color 0.2s ease, color 0.2s ease;
}

.pill-segment.is-inactive {
    background: #000;
    color: #fff;
}

.pill-segment.is-active {
    background: #f5e027;
    color: #000;
}

/* MAIN CONTENT */
.main-content {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 90px 24px 90px;
    z-index: 10;
}

.view-section {
    display: none;
    width: 100%;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.view-section.is-visible {
    display: flex;
}

h1 {
    font-family: "CityBurn", sans-serif;
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 3px;
    color: #000;
    text-transform: uppercase;
    text-align: center;
}

/* SIGN UP FORM */
.signup-wrapper {
    width: 100%;
    max-width: 340px;
}

.signup-wrapper h1 {
    margin-bottom: 32px;
}

.signup-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field-group label {
    font-family: "Bohemian Typewriter", serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #000;
}

.field-group input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #000;
    border-radius: 0;
    padding: 6px 2px;
    font-family: "Bohemian Typewriter", serif;
    font-size: 14px;
    color: #000;
    outline: none;
}

.field-group input::placeholder {
    color: #99927f;
}

.field-group input:focus {
    border-bottom: 1.5px solid #000;
}

.field-error {
    font-family: "Bohemian Typewriter", serif;
    font-size: 11px;
    color: #b91c1c;
    display: none;
}

.field-error.visible {
    display: block;
}

/* SUBMIT BUTTON */
.btn-signup {
    margin-top: 8px;
    width: 100%;
    padding: 12px 16px;
    background: #000;
    color: #fff;
    border: none;
    font-family: "Bohemian Typewriter", serif;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.08s ease, color 0.08s ease;
}

.btn-signup:active,
.btn-signup.is-pressed {
    background: #fff !important;
    color: #000 !important;
}

.status-msg {
    font-family: "Bohemian Typewriter", serif;
    font-size: 12px;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 18px;
    color: #000;
    display: none;
}

.status-msg.visible {
    display: block;
}

/* FOOTER */
.footer {
    position: fixed;
    bottom: 25px;
    left: 30px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    z-index: 15;
}

.footer button {
    background: none;
    border: none;
    padding: 0;
    color: #000;
    font-family: "Bohemian Typewriter", serif;
    font-size: 15px;
    font-weight: normal;
    cursor: default;
    text-transform: uppercase;
    opacity: 1;
    transition: color 0.3s ease;
}

.footer button:hover {
    color: #99927f;
}

.footer button:disabled {
    opacity: 1;
}

/* SOCIAL ICONS BOTTOM RIGHT */
.social-links {
    position: fixed;
    bottom: 24px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 15;
}

.social-links a {
    color: #000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s ease;
}

.social-links a:hover {
    color: #99927f;
}

.social-links svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
}

/* MOBILE */
@media (max-width: 768px) {
    .top-header {
        top: 16px;
        right: 18px;
        left: 18px;
        justify-content: space-between;
        gap: 12px;
    }

    .top-nav {
        gap: 12px;
        flex-wrap: wrap;
    }

    .top-nav button,
    .top-nav a {
        font-size: 12px;
    }

    .pill-segment {
        font-size: 11px;
        padding: 3px 11px;
    }

    .footer {
        left: 18px;
        right: 18px;
        bottom: 46px;
        gap: 12px;
    }

    .footer button {
        font-size: 12px;
    }

    .social-links {
        left: 18px;
        right: auto;
        bottom: 16px;
        gap: 14px;
    }

    h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loader" title="Click para continuar">
    <div class="spinner"></div>
</div>

<!-- TOP NAVIGATION & SPLIT PILL BUTTON -->
<header class="top-header">
    <nav class="top-nav" aria-label="Primary Navigation">
        <button type="button" data-nav="home">STORE</button>
        <button type="button" data-nav="home">LIVE</button>
        <button type="button" data-nav="home">VIDEOS</button>
        <button type="button" id="navSignUp" data-nav="signup">SIGN UP</button>
        <button type="button" data-nav="home">MUSIC</button>
    </nav>

    <button type="button" class="pill-toggle" id="pillToggle" aria-label="Switch mode RWP / SC">
        <span class="pill-segment is-inactive" id="pillLeft">RWP</span>
        <span class="pill-segment is-active" id="pillRight">SC</span>
    </button>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
    <!-- HOME VIEW -->
    <section id="homeView" class="view-section is-visible">
        <h1>COMING SOON</h1>
    </section>

    <!-- SIGN UP VIEW -->
    <section id="signupView" class="view-section">
        <div class="signup-wrapper">
            <h1>Sign Up</h1>

            <p id="statusMsg" class="status-msg" role="alert"></p>

            <form id="signupForm" class="signup-form" novalidate>
                <div class="field-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="user_01" autocomplete="username" required>
                    <span id="usernameError" class="field-error"></span>
                </div>

                <div class="field-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" autocomplete="email" required>
                    <span id="emailError" class="field-error"></span>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                    <span id="passwordError" class="field-error"></span>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required>
                    <span id="confirmPasswordError" class="field-error"></span>
                </div>

                <button type="submit" id="submitBtn" class="btn-signup">Sign Up</button>
            </form>
        </div>
    </section>
</main>

<!-- FOOTER -->
<footer class="footer">
    <button disabled>© CAPRYL</button>
    <button disabled>PRIVACY POLICY</button>
    <button disabled>TERMS &amp; CONDITIONS</button>
    <button disabled>DO NOT SELL MY PERSONAL INFORMATION</button>
    <button disabled>COOKIE CHOICES</button>
</footer>

<script>
(function () {
    const loader = document.getElementById("loader");
    if (!loader) return;

    let loaderClosed = false;
    let mainTimer = null;
    let safetyTimer = null;

    function destroyLoader() {
        if (loaderClosed) return;
        loaderClosed = true;

        if (mainTimer) clearTimeout(mainTimer);
        if (safetyTimer) clearTimeout(safetyTimer);

        loader.classList.add("is-hidden");
        setTimeout(() => {
            loader.classList.add("is-gone");
        }, 520);
    }

    // Siempre se cierra como máximo a los 3.5s (y respaldo a los 4.2s) para evitar cualquier loop
    mainTimer = setTimeout(destroyLoader, 3500);
    safetyTimer = setTimeout(destroyLoader, 4200);

    loader.addEventListener("click", destroyLoader, { once: true });
    document.addEventListener("keydown", function onKeySkip(e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
            document.removeEventListener("keydown", onKeySkip);
            destroyLoader();
        }
    });
})();

document.addEventListener("DOMContentLoaded", () => {
    // Navegación entre COMING SOON y SIGN UP
    const homeView = document.getElementById("homeView");
    const signupView = document.getElementById("signupView");
    const navSignUp = document.getElementById("navSignUp");
    const navButtons = document.querySelectorAll(".top-nav button");

    navButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            const target = btn.getAttribute("data-nav");
            if (target === "signup") {
                homeView.classList.remove("is-visible");
                signupView.classList.add("is-visible");
                navSignUp.classList.add("active-link");
                document.title = "Sign Up - daniel saiza";
            } else {
                signupView.classList.remove("is-visible");
                homeView.classList.add("is-visible");
                navSignUp.classList.remove("active-link");
                document.title = "Home - daniel saiza";
            }
        });
    });

    // Botón dividido RWP / SC
    const pillToggle = document.getElementById("pillToggle");
    const pillLeft = document.getElementById("pillLeft");
    const pillRight = document.getElementById("pillRight");
    let isRightActive = true;

    pillToggle.addEventListener("click", () => {
        isRightActive = !isRightActive;
        if (isRightActive) {
            pillLeft.className = "pill-segment is-inactive";
            pillRight.className = "pill-segment is-active";
        } else {
            pillLeft.className = "pill-segment is-active";
            pillRight.className = "pill-segment is-inactive";
        }
    });

    // Estado presionado del botón Sign Up
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.addEventListener("touchstart", () => submitBtn.classList.add("is-pressed"), { passive: true });
    ["touchend", "touchcancel"].forEach(evt => {
        submitBtn.addEventListener(evt, () => submitBtn.classList.remove("is-pressed"));
    });

    // Validación del formulario
    const form = document.getElementById("signupForm");
    const statusMsg = document.getElementById("statusMsg");

    const fields = {
        username: { input: document.getElementById("username"), error: document.getElementById("usernameError") },
        email: { input: document.getElementById("email"), error: document.getElementById("emailError") },
        password: { input: document.getElementById("password"), error: document.getElementById("passwordError") },
        confirmPassword: { input: document.getElementById("confirmPassword"), error: document.getElementById("confirmPasswordError") }
    };

    Object.keys(fields).forEach(key => {
        fields[key].input.addEventListener("input", () => {
            fields[key].error.classList.remove("visible");
            statusMsg.classList.remove("visible");
        });
    });

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        let valid = true;

        Object.keys(fields).forEach(key => fields[key].error.classList.remove("visible"));
        statusMsg.classList.remove("visible");

        const u = fields.username.input.value.trim();
        const em = fields.email.input.value.trim();
        const pw = fields.password.input.value;
        const cpw = fields.confirmPassword.input.value;

        if (u.length < 3) {
            fields.username.error.textContent = "MINIMUM 3 CHARACTERS REQUIRED.";
            fields.username.error.classList.add("visible");
            valid = false;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
            fields.email.error.textContent = "ENTER A VALID EMAIL.";
            fields.email.error.classList.add("visible");
            valid = false;
        }

        if (pw.length < 8) {
            fields.password.error.textContent = "MINIMUM 8 CHARACTERS REQUIRED.";
            fields.password.error.classList.add("visible");
            valid = false;
        }

        if (cpw !== pw || cpw === "") {
            fields.confirmPassword.error.textContent = "PASSWORDS DO NOT MATCH.";
            fields.confirmPassword.error.classList.add("visible");
            valid = false;
        }

        if (valid) {
            statusMsg.textContent = `SIGNED UP AS ${u.toUpperCase()}.`;
            statusMsg.classList.add("visible");
            form.reset();
        }
    });
});
</script>
